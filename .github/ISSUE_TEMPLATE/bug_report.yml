name: Bug Report
description: Create a report to help us reproduce and fix an issue in Ocean
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: ocean-code
    attributes:
      label: Ocean Code Sample (.ocean / .oc)
      description: Minimal reproducible Ocean code demonstrating the bug.
      render: ocean
      placeholder: |
        package test;

        class BugRepro {
            main() {
                // ...
            }
        }
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen and what happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating System, Java version (`java -version`), Ocean build version.
      placeholder: |
        - OS: Windows 11 / Linux Ubuntu 24.04 / macOS Sonoma
        - JDK: Amazon Corretto 22 / Eclipse Temurin 21
        - Ocean: v1.0-SNAPSHOT
    validations:
      required: false
